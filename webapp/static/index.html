<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>УИБО-03-24</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:        #0f1115;
    --bg-card:   #181b22;
    --bg-raised: #21242e;
    --text:      #f2f3f7;
    --hint:      #9aa0ac;
    --accent:    #7c7ff5;
    --accent-2:  #43c6ac;
    --danger:    #ff6363;
    --warn:      #ffb238;
    --ok:        #3ddc84;
    --border:    #2a2e3a;
    --radius:    18px;
    --radius-sm: 12px;
    --shadow:    0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    padding-bottom: 84px;
    overscroll-behavior-y: contain;
  }
  ::-webkit-scrollbar { display: none; }

  header.top {
    padding: 18px 18px 10px;
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(180deg, var(--bg) 60%, transparent);
  }
  header.top h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  header.top p {
    margin: 2px 0 0;
    color: var(--hint);
    font-size: 13px;
  }

  main { padding: 6px 14px 20px; }

  .view { display: none; animation: fadein .18s ease; }
  .view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

  .bento {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .bento .wide { grid-column: 1 / -1; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .card.tap { cursor: pointer; transition: transform .12s ease, background .12s ease; }
  .card.tap:active { transform: scale(0.97); background: var(--bg-raised); }

  .card .eyebrow {
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--accent-2);
    margin: 0 0 6px;
  }
  .card .big { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .card .sub { color: var(--hint); font-size: 13px; margin: 0; }

  .schedule-html { font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
  .schedule-html s { color: var(--hint); }
  .schedule-html b { color: var(--accent-2); }

  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    background: var(--bg-raised);
    color: var(--hint);
    border: 1px solid var(--border);
  }
  .chip.ok      { background: rgba(61,220,132,.14); color: var(--ok); border-color: rgba(61,220,132,.3); }
  .chip.warn    { background: rgba(255,178,56,.14); color: var(--warn); border-color: rgba(255,178,56,.3); }
  .chip.danger  { background: rgba(255,99,99,.14);  color: var(--danger); border-color: rgba(255,99,99,.3); }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabs button {
    flex: 1;
    background: none; border: none; color: var(--hint);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 600;
    padding: 6px 2px;
    border-radius: var(--radius-sm);
    transition: color .15s ease, background .15s ease;
  }
  nav.tabs button .ic { font-size: 20px; line-height: 1; }
  nav.tabs button.active { color: var(--accent); background: rgba(124,127,245,.12); }

  h2.section {
    font-size: 15px;
    font-weight: 800;
    margin: 18px 2px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  h2.section .stat { font-size: 12px; color: var(--hint); font-weight: 600; }

  .list { display: flex; flex-direction: column; gap: 8px; }

  .deadline-card {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    transition: opacity .2s ease, transform .12s ease;
  }
  .deadline-card:active { transform: scale(0.985); }
  .deadline-card.done { opacity: .45; }
  .deadline-card.done .dl-title { text-decoration: line-through; }

  .checkbox {
    width: 24px; height: 24px; min-width: 24px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900;
    margin-top: 1px;
  }
  .checkbox.checked { background: var(--accent); color: #fff; }

  .dl-body { flex: 1; min-width: 0; }
  .dl-title { font-weight: 700; margin: 0 0 3px; word-break: break-word; }
  .dl-desc { color: var(--hint); font-size: 13px; margin: 0 0 6px; word-break: break-word; }
  .dl-meta { display: flex; gap: 6px; flex-wrap: wrap; }

  .file-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .file-card .ic { font-size: 22px; }
  .file-card .ft { font-weight: 700; }
  .file-card .fs { color: var(--hint); font-size: 12.5px; }
  .file-card button {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 12.5px;
    font-weight: 700;
  }

  input.searchbox, select.filter {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  input.searchbox::placeholder { color: var(--hint); }

  /* Поиск расписания */
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 12px; }
  .chips-row button {
    flex: none; background: var(--bg-card); color: var(--hint);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 12.5px; font-weight: 700;
  }
  .chips-row button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .target-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer;
  }
  .target-item:active { transform: scale(0.985); background: var(--bg-raised); }
  .target-item .ic { font-size: 20px; }
  .target-item .tt { font-weight: 700; }
  .target-item .ts { color: var(--hint); font-size: 12px; }
  .target-item .go { margin-left: auto; color: var(--hint); font-size: 18px; }
  .recent-title { color: var(--hint); font-size: 12px; font-weight: 700; text-transform: uppercase;
                  letter-spacing: .05em; margin: 4px 2px 8px; }
  button.back {
    background: none; border: none; color: var(--accent);
    font-size: 14px; font-weight: 700; padding: 4px 2px 10px;
  }

  .empty {
    text-align: center;
    color: var(--hint);
    padding: 30px 10px;
    font-size: 13.5px;
  }

  /* Чат */
  /* Поле ввода закреплено над панелью вкладок, как в мессенджерах. Раньше
     чат был высотой calc(100vh - 180px): внутри Telegram 100vh не равен
     видимой высоте окна, и поле ввода уезжало под панель вкладок — писать
     было нельзя (живой тест). --nav-h выставляет JS по реальной высоте панели. */
  .chat-wrap { padding-bottom: calc(var(--nav-h, 64px) + var(--dock-h, 60px) + 20px); }
  .chat-log { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 14px; word-wrap: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .msg.bot  { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .msg.bot.pending { color: var(--hint); }

  .think {
    margin-top: 8px;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  .think summary {
    cursor: pointer;
    color: var(--accent-2);
    font-size: 12px;
    font-weight: 700;
    list-style: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::before { content: "🧠 "; }
  .think[open] summary::after { content: " ▲"; }
  .think:not([open]) summary::after { content: " ▼"; }
  .think .think-body {
    margin-top: 6px;
    color: var(--hint);
    font-size: 12.5px;
    white-space: pre-wrap;
    border-left: 2px solid var(--border);
    padding-left: 10px;
  }

  .chat-dock {
    position: fixed; left: 0; right: 0; z-index: 9;
    bottom: var(--nav-h, 64px);
    padding: 8px 14px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
  body.typing nav.tabs { display: none; }
  body.typing .chat-dock { bottom: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .chat-input-row button.attach {
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
    padding: 0 12px; font-size: 18px; min-height: 42px;
  }
  #attach-preview:empty { display: none; }
  #attach-preview { margin-bottom: 8px; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 6px 8px 6px 6px; font-size: 13px;
  }
  .attach-chip img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
  .attach-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 210px; }
  .attach-chip button { background: none; border: none; color: var(--hint); font-size: 16px; padding: 0 2px; }
  .msg img.att { display: block; max-width: 220px; max-height: 220px; border-radius: 12px; margin-bottom: 6px; }
  .msg .file-att { display: inline-block; background: rgba(255,255,255,.18); border-radius: 10px;
                   padding: 4px 9px; margin-bottom: 6px; font-size: 13px; }
  .msg .msg-tools { margin-top: 6px; display: flex; gap: 10px; }
  .msg .msg-tools button { background: none; border: none; color: var(--hint); font-size: 12px; font-weight: 700; padding: 0; }
  .msg.typing-dots { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .msg.typing-dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--hint);
    animation: blink 1.2s infinite ease-in-out;
  }
  .msg.typing-dots span:nth-child(2) { animation-delay: .2s; }
  .msg.typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .chat-empty { text-align: center; color: var(--hint); padding: 22px 8px 6px; }
  .chat-empty .big-emoji { font-size: 40px; }
  .chat-empty p { margin: 6px 0 14px; font-size: 14px; }
  .suggest { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .suggest button {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    border-radius: 14px; padding: 10px 12px; font-size: 14px; text-align: left;
  }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 700; padding: 0; }
  .chat-input-row textarea {
    flex: 1;
    resize: none;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-family: inherit;
    min-height: 42px; line-height: 1.3;
    font-size: 16px; /* меньше 16px — iOS при фокусе приближает страницу */
    max-height: 100px;
  }
  .chat-input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 18px;
    font-weight: 800;
    font-size: 16px;
    min-height: 42px;
  }
  .chat-input-row button:disabled { opacity: .5; }
</style>
</head>
<body>

<header class="top">
  <h1 id="greeting">УИБО-03-24</h1>
  <p id="subtitle">открываю…</p>
</header>

<main>

  <!-- ── Сегодня ───────────────────────────────────────────────────── -->
  <section class="view active" id="view-today">
    <div class="bento">
      <div class="card wide">
        <p class="eyebrow">Сегодня</p>
        <div class="schedule-html" id="today-schedule">Загружаю…</div>
      </div>
      <div class="card tap" onclick="switchTab('deadlines')">
        <p class="eyebrow">Дедлайны</p>
        <p class="big" id="today-deadline-count">—</p>
        <p class="sub">ближайшие</p>
      </div>
      <div class="card tap" onclick="loadWeek()">
        <p class="eyebrow">Неделя</p>
        <p class="big">📆</p>
        <p class="sub">открыть расписание</p>
      </div>
      <div class="card wide" id="week-card" style="display:none;">
        <p class="eyebrow">Неделя целиком</p>
        <div class="schedule-html" id="week-schedule"></div>
      </div>
    </div>
  </section>

  <!-- ── Дедлайны / ДЗ ─────────────────────────────────────────────── -->
  <section class="view" id="view-deadlines">
    <h2 class="section">Дедлайны и ДЗ <span class="stat" id="deadline-stat"></span></h2>
    <div class="list" id="deadline-list"><div class="empty">Загружаю…</div></div>
  </section>

  <!-- ── Поиск расписания ─────────────────────────────────────────── -->
  <section class="view" id="view-search">
    <div id="search-pane">
      <h2 class="section">Расписание МИРЭА <span class="stat" id="index-stat"></span></h2>
      <input class="searchbox" id="target-search" placeholder="Фамилия, группа или аудитория" autocomplete="off">
      <div class="chips-row" id="target-types">
        <button class="active" data-type="0">Все</button>
        <button data-type="2">👤 Преподаватели</button>
        <button data-type="1">👥 Группы</button>
        <button data-type="3">🚪 Аудитории</button>
      </div>
      <div id="target-recent"></div>
      <div class="list" id="target-list"></div>
    </div>
    <div id="target-view" style="display:none;">
      <button class="back" onclick="closeTarget()">← к поиску</button>
      <div class="card">
        <p class="eyebrow" id="target-kind"></p>
        <p class="big" id="target-title"></p>
        <div class="schedule-html" id="target-schedule">Загружаю…</div>
      </div>
    </div>
  </section>

  <!-- ── Файлы ─────────────────────────────────────────────────────── -->
  <section class="view" id="view-files">
    <h2 class="section">Файлы</h2>
    <input class="searchbox" id="file-search" placeholder="Поиск по названию, предмету, файлу…">
    <div class="list" id="file-list"><div class="empty">Загружаю…</div></div>
  </section>

  <!-- ── Чат ───────────────────────────────────────────────────────── -->
  <section class="view" id="view-chat">
    <h2 class="section">Чат с ИИ 🤖 <button class="link-btn" onclick="newChat()">＋ Новый чат</button></h2>
    <select class="filter" id="chat-subject">
      <option value="">📚 Предмет: любой</option>
    </select>
    <div class="chat-wrap">
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-dock">
        <div id="attach-preview"></div>
        <div class="chat-input-row">
          <button class="attach" onclick="document.getElementById('chat-file').click()" aria-label="Прикрепить">📎</button>
          <textarea id="chat-input" rows="1" placeholder="Сообщение…"></textarea>
          <button id="chat-send" onclick="sendChat()" aria-label="Отправить">➤</button>
        </div>
        <input type="file" id="chat-file" accept="image/*,.pdf,.docx,.pptx,.txt" hidden>
      </div>
    </div>
  </section>

</main>

<nav class="tabs">
  <button class="active" data-tab="today" onclick="switchTab('today')"><span class="ic">📅</span>Сегодня</button>
  <button data-tab="deadlines" onclick="switchTab('deadlines')"><span class="ic">📋</span>Дедлайны</button>
  <button data-tab="search" onclick="switchTab('search')"><span class="ic">🔍</span>Поиск</button>
  <button data-tab="files" onclick="switchTab('files')"><span class="ic">📁</span>Файлы</button>
  <button data-tab="chat" onclick="switchTab('chat')"><span class="ic">🤖</span>Чат</button>
</nav>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
const BOT_USERNAME = "uiboshkibot"; // если бот переименуют — поменять тут

if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("secondary_bg_color"); } catch (e) {}
  const tp = tg.themeParams || {};
  const root = document.documentElement.style;
  if (tp.bg_color)            root.setProperty("--bg", tp.bg_color);
  if (tp.secondary_bg_color)  root.setProperty("--bg-card", tp.secondary_bg_color);
  if (tp.text_color)          root.setProperty("--text", tp.text_color);
  if (tp.hint_color)          root.setProperty("--hint", tp.hint_color);
  if (tp.button_color)        root.setProperty("--accent", tp.button_color);
  // Светлая тема Telegram: тёмные рамки и тяжёлая тень из тёмной палитры
  // смотрелись грубо (замечено в живом тесте) — делаем их светлыми.
  if (tg.colorScheme === "light") {
    root.setProperty("--border", tp.section_separator_color || "#e4e6ea");
    root.setProperty("--bg-raised", "#eceef1");
    root.setProperty("--shadow", "0 2px 10px rgba(0,0,0,0.06)");
  } else if (tp.section_separator_color) {
    root.setProperty("--border", tp.section_separator_color);
  }
}

function initData() {
  return tg ? tg.initData : "";
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({
    "X-Telegram-Init-Data": initData(),
    "Content-Type": "application/json",
  }, opts.headers || {});
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    const body = await resp.text();
    let detail = "";
    try { detail = JSON.parse(body).detail; } catch (e) {}
    throw new Error(typeof detail === "string" && detail ? detail : "ошибка сервера (" + resp.status + ")");
  }
  return resp.json();
}

function haptic(kind) {
  if (tg && tg.HapticFeedback) {
    try {
      if (kind === "success") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    } catch (e) {}
  }
}

// ── Табы ──────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  haptic();
  if (name === "deadlines") loadDeadlines();
  if (name === "files") loadFiles();
  if (name === "search") renderRecent();
  if (name === "chat") requestAnimationFrame(syncNavHeight);
  if (name !== "search" && tg && tg.BackButton) tg.BackButton.hide();
}

// ── Сегодня ───────────────────────────────────────────────────────────────

async function loadToday() {
  try {
    const me = await api("/api/me");
    document.getElementById("greeting").textContent = "Привет, " + (me.first_name || "!");
    document.getElementById("subtitle").textContent = "УИБО-03-24 · сегодня";
  } catch (e) {
    document.getElementById("subtitle").textContent = "Не удалось авторизоваться: " + e.message;
  }
  try {
    const data = await api("/api/schedule/today");
    document.getElementById("today-schedule").innerHTML = data.html || "Пар нет 🎉";
  } catch (e) {
    document.getElementById("today-schedule").textContent = "Не загрузилось: " + e.message;
  }
  try {
    const dl = await api("/api/deadlines");
    document.getElementById("today-deadline-count").textContent = dl.stats.active;
  } catch (e) {}
}

let weekLoaded = false;
async function loadWeek() {
  const card = document.getElementById("week-card");
  card.style.display = "block";
  if (weekLoaded) return;
  weekLoaded = true;
  try {
    const data = await api("/api/schedule/week");
    document.getElementById("week-schedule").innerHTML = data.html;
  } catch (e) {
    document.getElementById("week-schedule").textContent = "Не загрузилось: " + e.message;
  }
}

// ── Дедлайны ──────────────────────────────────────────────────────────────

function dueBadge(item) {
  if (item.done) return '<span class="chip ok">✓ готово</span>';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(item.due_date + "T00:00:00");
  const days = Math.round((due - today) / 86400000);
  let cls = "ok", label;
  if (days < 0) { cls = "danger"; label = "просрочено"; }
  else if (days === 0) { cls = "danger"; label = "сегодня"; }
  else if (days === 1) { cls = "warn"; label = "завтра"; }
  else if (days <= 3) { cls = "warn"; label = "через " + days + " дн."; }
  else { label = item.due_date; }
  return '<span class="chip ' + cls + '">' + label + '</span>';
}

async function loadDeadlines() {
  const list = document.getElementById("deadline-list");
  try {
    const data = await api("/api/deadlines?include_done=true");
    const stat = data.stats;
    document.getElementById("deadline-stat").textContent =
      stat.active + " активных · " + stat.overdue + " просрочено";
    if (!data.items.length) {
      list.innerHTML = '<div class="empty">Дедлайнов пока нет 🎉</div>';
      return;
    }
    list.innerHTML = data.items.map(renderDeadline).join("");
  } catch (e) {
    list.innerHTML = '<div class="empty">Не загрузилось: ' + e.message + '</div>';
  }
}

function renderDeadline(item) {
  return (
    '<div class="deadline-card ' + (item.done ? "done" : "") + '" onclick="toggleDeadline(' + item.id + ', ' + (!item.done) + ')">' +
      '<div class="checkbox ' + (item.done ? "checked" : "") + '">' + (item.done ? "✓" : "") + '</div>' +
      '<div class="dl-body">' +
        '<p class="dl-title">' + escapeHtml(item.subject) + '</p>' +
        (item.description ? '<p class="dl-desc">' + escapeHtml(item.description) + '</p>' : '') +
        '<div class="dl-meta">' + dueBadge(item) + '</div>' +
      '</div>' +
    '</div>'
  );
}

async function toggleDeadline(id, done) {
  haptic("success");
  try {
    await api("/api/deadlines/" + id + "/toggle", { method: "POST", body: JSON.stringify({ done: done }) });
    loadDeadlines();
    loadToday();
  } catch (e) {
    alert("Не получилось: " + e.message);
  }
}

// ── Файлы ─────────────────────────────────────────────────────────────────

let fileSearchTimer = null;
document.getElementById("file-search").addEventListener("input", (e) => {
  clearTimeout(fileSearchTimer);
  fileSearchTimer = setTimeout(() => loadFiles(e.target.value), 300);
});

async function loadFiles(q) {
  const list = document.getElementById("file-list");
  try {
    const data = await api("/api/files?q=" + encodeURIComponent(q || ""));
    if (!data.items.length) {
      list.innerHTML = '<div class="empty">Ничего не нашлось</div>';
      return;
    }
    list.innerHTML = data.items.map(f =>
      '<div class="file-card">' +
        '<span class="ic">📄</span>' +
        '<div><div class="ft">' + escapeHtml(f.title) + '</div>' +
        '<div class="fs">' + escapeHtml(f.subject || f.file_name || "") + '</div></div>' +
        '<button onclick="openFile(' + f.id + ')">Открыть</button>' +
      '</div>'
    ).join("");
  } catch (e) {
    list.innerHTML = '<div class="empty">Не загрузилось: ' + e.message + '</div>';
  }
}

function openFile(id) {
  const link = "https://t.me/" + BOT_USERNAME + "?start=file_" + id;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link);
  else window.open(link, "_blank");
}

// ── Поиск расписания: преподаватель / группа / аудитория ──────────────────

const TARGET_KIND = { 1: ["👥", "Группа"], 2: ["👤", "Преподаватель"], 3: ["🚪", "Аудитория"] };
let targetType = 0;
let targetTimer = null;
let targetSeq = 0;

document.querySelectorAll("#target-types button").forEach(b => b.addEventListener("click", () => {
  targetType = Number(b.dataset.type);
  document.querySelectorAll("#target-types button").forEach(x => x.classList.toggle("active", x === b));
  haptic();
  searchTargets(document.getElementById("target-search").value);
}));

document.getElementById("target-search").addEventListener("input", (e) => {
  clearTimeout(targetTimer);
  targetTimer = setTimeout(() => searchTargets(e.target.value), 250);
});

function targetItem(t) {
  const kind = TARGET_KIND[t.type] || ["📅", ""];
  return '<div class="target-item" onclick="openTarget(' + t.type + ',' + t.id + ',' + escapeHtml(JSON.stringify(t.title)) + ')">' +
    '<span class="ic">' + kind[0] + '</span>' +
    '<div><div class="tt">' + escapeHtml(t.title) + '</div><div class="ts">' + kind[1] + '</div></div>' +
    '<span class="go">›</span></div>';
}

async function searchTargets(q) {
  const list = document.getElementById("target-list");
  q = (q || "").trim();
  document.getElementById("target-recent").style.display = q ? "none" : "block";
  if (q.length < 2) { list.innerHTML = ""; renderRecent(); return; }
  const seq = ++targetSeq;
  list.innerHTML = '<div class="empty">Ищу…</div>';
  try {
    const data = await api("/api/search?q=" + encodeURIComponent(q) + "&type=" + targetType);
    if (seq !== targetSeq) return;  // пришёл ответ на старый запрос — пользователь уже печатает дальше
    if (!data.items.length) {
      list.innerHTML = '<div class="empty">' + (data.ready
        ? "Ничего не нашлось"
        : "Справочник ещё собирается (первый запуск, около получаса) — попробуй чуть позже") + '</div>';
      return;
    }
    list.innerHTML = data.items.map(targetItem).join("");
  } catch (e) {
    if (seq === targetSeq) list.innerHTML = '<div class="empty">Не загрузилось: ' + escapeHtml(e.message) + '</div>';
  }
}

function recentTargets() {
  try { return JSON.parse(localStorage.getItem("recentTargets") || "[]"); } catch (e) { return []; }
}

function rememberTarget(t) {
  try {
    const rest = recentTargets().filter(x => !(x.type === t.type && x.id === t.id));
    localStorage.setItem("recentTargets", JSON.stringify([t].concat(rest).slice(0, 6)));
  } catch (e) {}
}

function renderRecent() {
  const box = document.getElementById("target-recent");
  const items = recentTargets();
  box.innerHTML = items.length
    ? '<p class="recent-title">Недавние</p><div class="list">' + items.map(targetItem).join("") + '</div>'
    : '<div class="empty">Начни вводить фамилию преподавателя, номер группы или аудитории — например «Морозов» или «УИБО-03»</div>';
}

async function openTarget(type, id, title) {
  haptic();
  rememberTarget({ type: type, id: id, title: title });
  const kind = TARGET_KIND[type] || ["📅", ""];
  document.getElementById("search-pane").style.display = "none";
  document.getElementById("target-view").style.display = "block";
  document.getElementById("target-kind").textContent = kind[0] + " " + kind[1] + " · 2 недели";
  document.getElementById("target-title").textContent = title;
  const box = document.getElementById("target-schedule");
  box.textContent = "Загружаю…";
  window.scrollTo(0, 0);
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeTarget); }
  try {
    const data = await api("/api/target/" + type + "/" + id);
    box.innerHTML = data.html;  // собран сервером из экранированных строк (schedule_parser)
  } catch (e) {
    box.textContent = "Не загрузилось: " + e.message;
  }
}

function closeTarget() {
  document.getElementById("target-view").style.display = "none";
  document.getElementById("search-pane").style.display = "block";
  if (tg && tg.BackButton) { tg.BackButton.offClick(closeTarget); tg.BackButton.hide(); }
  renderRecent();
}

// ── Чат ───────────────────────────────────────────────────────────────────

// История чата живёт в localStorage этого устройства (только текст, без
// вложений): закрыл WebApp — открыл — разговор на месте. «Новый чат» — чистит.
const CHAT_KEY = "chatLog.v1";
let chatLog = loadChatLog();          // [{role, content, html, att}]
let pendingAttachment = null;         // {name, mime, data(base64), url}

function loadChatLog() {
  try { return JSON.parse(localStorage.getItem(CHAT_KEY) || "[]"); } catch (e) { return []; }
}
function saveChatLog() {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify(chatLog.slice(-40))); } catch (e) {}
}

const SUGGESTIONS = [
  "Что сдавать на этой неделе?",
  "Какие у нас пары завтра?",
  "Объясни простыми словами, что такое NPV",
  "📷 Прикрепи фото задачи — решу по шагам",
];

function renderChat() {
  const log = document.getElementById("chat-log");
  log.innerHTML = "";
  if (!chatLog.length) {
    const empty = document.createElement("div");
    empty.className = "chat-empty";
    empty.innerHTML = '<div class="big-emoji">🤖</div><p>Спрашивай про учёбу, присылай фото задач и файлы лекций.<br>Я знаю ваше расписание, дедлайны и ДЗ.</p><div class="suggest"></div>';
    const box = empty.querySelector(".suggest");
    SUGGESTIONS.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t;
      b.onclick = () => {
        if (t.startsWith("📷")) { document.getElementById("chat-file").click(); return; }
        document.getElementById("chat-input").value = t;
        sendChat();
      };
      box.appendChild(b);
    });
    log.appendChild(empty);
    return;
  }
  chatLog.forEach(m => appendMsg(m.role, m.content, "", m.html, m.att, false));
}

function newChat() {
  haptic();
  chatLog = [];
  saveChatLog();
  clearAttachment();
  renderChat();
}

function appendMsg(role, content, reasoning, html, att, scroll = true) {
  const log = document.getElementById("chat-log");
  const empty = log.querySelector(".chat-empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  if (att && att.url) {
    const img = document.createElement("img");
    img.className = "att"; img.src = att.url; img.alt = att.name || "фото";
    div.appendChild(img);
  } else if (att && att.name) {
    const chip = document.createElement("div");
    chip.className = "file-att"; chip.textContent = (att.image ? "🖼 " : "📄 ") + att.name;
    div.appendChild(chip);
  }
  if (content || html) {
    const textNode = document.createElement("div");
    // html собирает сервер (utils.md_to_tg_html_chunks): всё, кроме <b>/<i>/<code>/<pre>, экранировано
    if (html) textNode.innerHTML = html; else textNode.textContent = content;
    div.appendChild(textNode);
  }
  if (reasoning) {
    const det = document.createElement("details");
    det.className = "think";
    det.innerHTML = '<summary>Ход мыслей</summary><div class="think-body"></div>';
    det.querySelector(".think-body").textContent = reasoning;
    div.appendChild(det);
  }
  if (role !== "user" && content && !content.startsWith("⚠️")) {
    const tools = document.createElement("div");
    tools.className = "msg-tools";
    const copy = document.createElement("button");
    copy.textContent = "⧉ Копировать";
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(content); } catch (e) {
        const ta = document.createElement("textarea"); ta.value = content; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove();
      }
      haptic("success");
      copy.textContent = "✓ Скопировано";
      setTimeout(() => { copy.textContent = "⧉ Копировать"; }, 1500);
    };
    tools.appendChild(copy);
    div.appendChild(tools);
  }
  log.appendChild(div);
  if (scroll) requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
  return div;
}

function typingBubble() {
  const log = document.getElementById("chat-log");
  const div = document.createElement("div");
  div.className = "msg bot typing-dots";
  div.innerHTML = "<span></span><span></span><span></span>";
  log.appendChild(div);
  requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
  return div;
}

// ── вложения ──
const MAX_FILE_MB = 10;
document.getElementById("chat-file").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (file.size > MAX_FILE_MB * 1024 * 1024) { alert("Файл больше " + MAX_FILE_MB + " МБ — не пролезет"); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = String(reader.result);
    const image = (file.type || "").startsWith("image/");
    pendingAttachment = {
      name: file.name || (image ? "фото.jpg" : "файл"),
      mime: file.type || "",
      data: dataUrl.slice(dataUrl.indexOf(",") + 1),
      url: image ? dataUrl : "",
      image: image,
    };
    renderAttachment();
    haptic();
  };
  reader.readAsDataURL(file);
});

function renderAttachment() {
  const box = document.getElementById("attach-preview");
  box.innerHTML = "";
  if (!pendingAttachment) return;
  const chip = document.createElement("div");
  chip.className = "attach-chip";
  if (pendingAttachment.url) {
    const img = document.createElement("img"); img.src = pendingAttachment.url; chip.appendChild(img);
  } else {
    const ic = document.createElement("span"); ic.textContent = "📄"; chip.appendChild(ic);
  }
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = pendingAttachment.name; chip.appendChild(nm);
  const x = document.createElement("button"); x.textContent = "✕"; x.setAttribute("aria-label", "Убрать"); x.onclick = clearAttachment;
  chip.appendChild(x);
  box.appendChild(chip);
  syncNavHeight();
}

function clearAttachment() {
  pendingAttachment = null;
  renderAttachment();
  syncNavHeight();
}

// ── предметы (с лекциями — чат опирается на них) ──
async function loadChatSubjects() {
  try {
    const data = await api("/api/subjects");
    const sel = document.getElementById("chat-subject");
    data.subjects.forEach(s => {
      const o = document.createElement("option");
      o.value = s.name; o.textContent = (s.lectures ? "📖 " : "") + s.name;
      sel.appendChild(o);
    });
  } catch (e) {}
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  const att = pendingAttachment;
  if (!text && !att) return;
  input.value = "";
  input.style.height = "auto";
  clearAttachment();
  const btn = document.getElementById("chat-send");
  btn.disabled = true;

  const shownAtt = att ? { name: att.name, url: att.url, image: att.image } : null;
  appendMsg("user", text, "", "", shownAtt);
  // В истории для сервера — только текст; само вложение уходит отдельным полем.
  const content = text || (att ? (att.image ? "Реши задание на фото." : "Разбери этот файл.") : "");
  chatLog.push({ role: "user", content: content, att: shownAtt ? { name: shownAtt.name, image: shownAtt.image } : null });
  saveChatLog();
  const pending = typingBubble();

  const history = chatLog.filter(m => m.content).map(m => ({ role: m.role, content: m.content }));
  const body = { history: history, subject: document.getElementById("chat-subject").value };
  if (att) body.attachment = { name: att.name, mime: att.mime, data: att.data };
  try {
    const data = await api("/api/chat", { method: "POST", body: JSON.stringify(body) });
    pending.remove();
    appendMsg("assistant", data.content, data.reasoning, data.html);
    chatLog.push({ role: "assistant", content: data.content, html: data.html });
    saveChatLog();
    haptic("success");
  } catch (e) {
    pending.remove();
    appendMsg("assistant", "⚠️ " + e.message);
  } finally {
    btn.disabled = false;
  }
}

// Высота панели вкладок (с учётом «безопасной зоны» внизу iPhone) — для
// поля ввода чата, которое стоит прямо над ней.
function syncNavHeight() {
  const nav = document.querySelector("nav.tabs");
  if (nav && nav.offsetHeight) document.documentElement.style.setProperty("--nav-h", nav.offsetHeight + "px");
  const dock = document.querySelector(".chat-dock");
  if (dock && dock.offsetHeight) document.documentElement.style.setProperty("--dock-h", dock.offsetHeight + "px");
}
syncNavHeight();
window.addEventListener("resize", syncNavHeight);
if (tg && tg.onEvent) tg.onEvent("viewportChanged", syncNavHeight);

// Пока открыта клавиатура — панель вкладок прячем, поле ввода опускаем вниз.
const chatInput = document.getElementById("chat-input");
chatInput.addEventListener("focus", () => document.body.classList.add("typing"));
chatInput.addEventListener("blur", () => setTimeout(() => {
  document.body.classList.remove("typing");
  syncNavHeight();
  // панель вкладок вернулась и подняла поле ввода — докручиваем, чтобы
  // последний ответ не остался под ним
  requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
}, 150));
chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + "px";
  syncNavHeight();
});

document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

// ── Утилиты ───────────────────────────────────────────────────────────────

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

loadToday();
renderChat();
loadChatSubjects();
</script>

# Линтер (CI: «ruff check .»). Только то, что ловит настоящие ошибки:
# F — неопределённые имена, неиспользуемые импорты/переменные, опечатки в
# f-строках; E9 — синтаксис. Стиль (длина строк, пробелы) не проверяем.
target-version = "py312"   # как в образе сервера
line-length = 130

[lint]
select = ["F", "E9"]

# Линтер (CI: «ruff check .»). Только то, что ловит настоящие ошибки, и
# любое новое нарушение сразу красит CI:
#   F — неопределённые имена, неиспользуемые импорты/переменные, опечатки в
#       f-строках; E9 — синтаксис; PLE — ошибки, которые видит pylint
#       (невидимые символы в строках и т. п.); PIE — пустые pass, лишнее;
#   RUF006 — asyncio.create_task без ссылки: задачу может съесть сборщик
#       мусора посреди работы (kapibara/core/tasks.spawn);
#   B — bugbear: замыкание на переменной цикла, raise без from, zip без strict;
#   ASYNC — блокирующие вызовы внутри async (бот замирает для всех);
#   SIM, C4, PERF, UP — лишний и устаревший код.
# B…UP добавлены после ревью 03.11: сначала через храповик (tools/ratchet.py,
# ruff_debt), в тот же день дошли до нуля. Новое строгое семейство — так же:
# в RUFF_DEBT храповика, на нуле — сюда. Стиль (длина строк, пробелы) не проверяем.
target-version = "py312"   # как в образе сервера
line-length = 130

[lint]
select = ["F", "E9", "PLE", "PIE", "RUF006", "B", "ASYNC", "SIM", "C4", "PERF", "UP"]
ignore = ["ASYNC109"]      # параметр timeout у async-функции — наш стиль, не баг

[lint.per-file-ignores]
# В тестах блокирующие файловые вызовы внутри async — норма: тест сам ждёт
# результат, цикла событий с живыми людьми там нет (а test_db_server_health
# нарочно его блокирует).
"tests/**" = ["ASYNC230", "ASYNC240", "ASYNC251"]

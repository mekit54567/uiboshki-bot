name: CI

# Прогоняет тесты (tests/, pytest) на каждый push и pull request в main.
# Реальный БД-слой, реальный роутинг aiogram (Dispatcher.feed_update) —
# сеть наружу (Telegram/Groq/Gemini) в тестах не используется, поэтому
# секреты (BOT_TOKEN и т.д.) для CI не нужны, тесты работают на фейковых
# значениях (см. tests/conftest.py).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # pr-check сравнивает с main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # С 23.10 обычный PR без версии — только заметка в changelog.d/next/;
      # номер и имя ставит релизный PR (tools/changelog.py release)
      - name: Версии (обычный PR — только заметка)
        if: github.event_name == 'pull_request'
        run: python tools/changelog.py pr-check origin/${{ github.base_ref }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (весь репозиторий)
        run: python -m py_compile $(git ls-files '*.py')

      - name: Lint (ruff — неопределённые имена, лишние импорты)
        run: ruff check .

      - name: Run tests
        run: python -m pytest -v

  # Своё приложение (app/, Flutter, этап 3): анализатор и тесты виджетов.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализатор
        run: flutter analyze

      - name: Тесты
        run: flutter test

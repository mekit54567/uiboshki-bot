name: Карточка версии в App Store Connect

# Ручной запуск: кладёт «Что нового» и скрины (docs/store/screens/framed) в версию
# iOS через API App Store Connect. НА ПРОВЕРКУ НЕ ОТПРАВЛЯЕТ — это делает владелец
# в App Store Connect. Ключ — те же секреты, что у загрузки в TestFlight.
# Сначала можно прогнать «dry_run»: покажет, что бы сделал, ничего не меняя.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для магазина, например 2.0.1"
        required: true
      whats_new:
        description: "Файл с текстом «Что нового» (от корня репозитория)"
        required: true
        default: "docs/store/whats-new-2.0.1.md"
      build_number:
        description: "Номер готовой iOS-сборки для этой версии (необязательно)"
        required: false
      dry_run:
        description: "Только показать, что будет сделано"
        type: boolean
        default: false

jobs:
  listing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "pyjwt[crypto]" httpx pillow
      - name: Выгрузка
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ inputs.version }}
          WHATS_NEW: ${{ inputs.whats_new }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--version "$VERSION" --whats-new "$WHATS_NEW" --screens docs/store/screens/framed)
          if [ -n "$BUILD_NUMBER" ]; then ARGS+=(--build-number "$BUILD_NUMBER"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python tools/asc_listing.py "${ARGS[@]}"

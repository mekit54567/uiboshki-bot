# Проверка типов (храповик, tools/ratchet.py → mypy_errors; ревью 03.11).
# Ошибок пока много — цифра в tools/ratchet.json и идёт только вниз;
# в ядре (kapibara/core, kapibara/bot, kapibara/jobs, database, bot.py) —
# ноль, и новый код там должен проходить проверку сразу (mypy_core).
[mypy]
files = bot.py, kapibara, database, webapp, handlers
explicit_package_bases = True
ignore_missing_imports = True
warn_unused_ignores = True
